maintainer=Dan Mowehhuk <danmowehhuk@gmail.com>
sentence=A lightweight framework for organizing and initializing complex Arduino applications with multiple interdependent modules
paragraph=Crankstart provides a structured way to define, wire, and start modules in Arduino projects that have several interconnected services or devices. It enforces a clear startup sequence with lifecycle hooks for setup and loop phases, ensuring that modules are initialized in dependency order. The framework helps improve reliability, maintainability, and unit testability without adding runtime overhead or dynamic memory usage.
